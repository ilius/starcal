name: Build Debian Package

on:
  push:
    branches: ["main", "next", "build-package"] 
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            dh-python \
            python3-all \
            python3-setuptools \
            devscripts \
            lintian

      - name: Build package
        env:
          STARCAL_XFCE_APPLET: "no"
        run: |
          mkdir -p /tmp/starcal3-out
          sudo bash distro/debian/build.sh /tmp/starcal3-out /usr/bin/python3
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: starcal3-debian
          path: /tmp/starcal3-out/*.deb
