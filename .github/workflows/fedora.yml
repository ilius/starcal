name: "Fedora package"

on:
  push:
    branches: ["main", "next", "build-package"]
  workflow_dispatch:

jobs:
  build:
    name: "Build Fedora package"
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          dnf install --assumeyes rpm-build git-core desktop-file-utils gettext
      - name: Build package
        env:
          STARCAL_XFCE_APPLET: "no"
        run: |
          mkdir -p /tmp/starcal3-out
          "$GITHUB_WORKSPACE/distro/fedora/build.sh" /tmp/starcal3-out /usr/bin/python3
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: starcal3-fedora
          path: /tmp/starcal3-out/*.rpm